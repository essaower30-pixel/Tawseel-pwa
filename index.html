    <!-- Safe Storage & Permissions fallback for iframes -->
    <script>
      (function() {
        try {
          var test = '__tw_test__';
          window.localStorage.setItem(test, test);
          window.localStorage.removeItem(test);
        } catch (e) {
          var memoryStore = {};
          var fallbackStorage = {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null; },
            setItem: function(k, v) { memoryStore[k] = String(v); },
            removeItem: function(k) { delete memoryStore[k]; },
            clear: function() { memoryStore = {}; },
            get length() { return Object.keys(memoryStore).length; },
            key: function(i) { return Object.keys(memoryStore)[i] || null; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: fallbackStorage, configurable: true, writable: true });
          } catch (e2) {}
          try {
            Object.defineProperty(window, 'sessionStorage', { value: fallbackStorage, configurable: true, writable: true });
          } catch (e3) {}
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 antialiased selection:bg-orange-500 selection:text-white relative min-h-screen">
    <div id="root">
      <!-- Instant Local Loading Shell (Replaced instantly when React mounts) -->
      <div id="app-offline-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; padding: 24px; text-align: center;">

            <circle cx="5.5" cy="17.5" r="3.5"/>

          </svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; color: #0f172a; margin: 0 0 6px 0; letter-spacing: -0.5px;">تطبيق توصيل</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0; font-weight: 600;">جاري فتح التطبيق محلياً...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA Install Prompt Listener
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwaInstallPromptReady'));
      });

      // Register Service Worker on production, PWA standalone, and live domains
      if ('serviceWorker' in navigator) {
        const isLocalDev = window.location.hostname === 'localhost' || window.location.port === '5173';
        const isIframePreview = window.self !== window.top && !window.location.search.includes('enable_sw');

        if (!isLocalDev && !isIframePreview) {
          // Listen for controllerchange to reload the page when a new service worker takes over
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          // Also listen for SW_VERSION_UPDATED postMessage from SW activate
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SW_VERSION_UPDATED') {
              if (!refreshing) {
                refreshing = true;
                window.location.reload();
              }
            }
          });

          window.addEventListener('load', () => {
            // Dynamically resolve service worker path and scope based on current location
            const pathname = window.location.pathname;
            const dir = pathname.substring(0, pathname.lastIndexOf('/') + 1) || '/';
            // Version query string ensures browser bypasses HTTP caching of sw.js
            const swPath = dir + 'sw.js?v=55';
            const swScope = dir;
            navigator.serviceWorker.register(swPath, { scope: swScope }).then((reg) => {
              reg.update();
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New worker installed over existing controller - force reload to activate!
                      if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                      }
                    }
                  };
                }
              };
              window.addEventListener('focus', () => reg.update());
              setInterval(() => {
                reg.update();
              }, 30000);
            }).catch((err) => {
              console.warn('SW registration notice:', err);
            });
          });
        }
      }
    </script>
  </body>
